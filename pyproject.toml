[project]
name = "heizoel"
version = "0.1.0"
description = "Heizöl-Kaufberater: Referenzpreis, Regionalaufschlag, deterministische Kaufregel, Mehrbenutzer-Web-UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "bcrypt>=4.1",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10,<4",
    "anthropic>=1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
heizoel = "heizoel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heizoel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
